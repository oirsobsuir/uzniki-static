<body>
    <header>
        <div class="header__container container">
            <div class="header__links">
                <a href="" class="links__item links__item--mobileUnvisible">О проекте</a>
                <a href="" class="links__item links__item--mobileUnvisible">Контакты</a>
            </div>
            <a href="" class="header__logo logo">
                <p>УЗНИКИ. ПАМЯТЬ: 1941-1945</p>
                <p>геноцид Белорусского народа</p>
            </a>
            <button id="menuButton_open" class="header__menuButton menuButton">
                <div></div>
                <div></div>
                <div></div>
            </button>
        </div>
    </header>
    <main>
        <div class="main__container container">
            <div id="map"></div>
        </div>
    </main>
    <footer>
        <div class="footer__container container">
            <div class="footer__sponsors">
                <a href="" class="sponsor__item"><img src="images/footer/BFM.svg" alt="БФМ" class="sponsor__image"></a>
                <a href="" class="sponsor__item"><img src="images/footer/BPC.svg" alt="БПЦ" class="sponsor__image"></a>
                <a href="" class="sponsor__item"><img src="images/footer/NARB.svg" alt="НАРБ" class="sponsor__image"></a>

            </div>
            <a href="" class="footer__privacyPolicy">Политика конфиденциальности</a>
            <a href="" class="footer__logo logo">

            </a>

        </div>
    </footer>
    <style>
        #map {
            margin-top: 150px;
            height: 600px;
        }
    </style>
    <script>
        var info = 'Озаричи';
        var fullInfo = '<img src="../map/delete-this.jpg" style="width:22vw;aspect-ratio:4/3;margin:0 0 0.5rem 0;"/><p style="margin:0 0 0.25rem 0">ОЗАРИЧИ</p><p style="margin:0 0 0.25rem 0"><strong>Местоположение:</strong><span>Беларусь, Гомельская область, Калинковичский район</span></p><p style="margin:0 0 0.25rem 0"><strong>Дата основания:</strong><span>10.03.1944</span></p><p style="margin:0"><strong>Количество умерших:</strong><span>13000</span></p>';
        var markerClicked = false;

        var map = L.map('map', { attributionControl: false }).setView([53.902222, 27.561389], 6);
        L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', { maxZoom: 19 }).addTo(map);
        map.zoomControl.setPosition('topright');
        L.control.attribution({ prefix: false, position: 'bottomright' }).addAttribution(
            '<div style="display:inline-block;height:0.5rem;width:0.5rem;background:#D88311;border-radius:0.5rem;"></div> — Концентрационные лагеря<br><div style="display:inline-block;height:0.5rem;width:0.5rem;background:#49598C;border-radius:0.5rem;"></div> — Концентрационные лагеря'
        ).addTo(map);

        var marker = L.marker([53.902222, 27.561389]).addTo(map);
        var popup = L.popup().setContent(info);
        marker.bindPopup(popup);

        marker.on('mouseover', () => {
            marker.openPopup();
        });

        marker.on('mouseout', () => {
            if (!markerClicked) {
                marker.closePopup();
            }
        });

        marker.on('click', () => {
            popup.setContent(fullInfo);
            marker.openPopup();
            markerClicked = true;
        });

        map.on('click', () => {
            popup.setContent(info);
            markerClicked = false;
        });
    </script>
</body>

</html>
